name: Marauder Studio
on:
  push:
    branches: [studio]
  pull_request:
    branches: [studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test terminal and protocol parsing with sanitizers
        run: python3 tests/test_terminal.py
      - name: Install pinned build tooling and matching SDK
        run: |
          python -m pip install ufbt==0.2.6
          ufbt update --hw-target f7 --url https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-012/flipper-z-f7-sdk-mntm-012.zip
      - name: Build for API 87.1
        run: ufbt
      - uses: actions/upload-artifact@v4
        with:
          name: marauder-studio-f7-api87.1
          path: dist/marauder_studio.fap
          if-no-files-found: error
